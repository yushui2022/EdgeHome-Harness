- id: living_room_light_off
  input: "把客厅灯关掉"
  expected:
    intent: control_device
    room: living_room
    device_id: living_room_main_light
    device_type: light
    action: turn_off
    policy_decision: allow
    dry_run_ready: true

- id: relative_light_decrease
  input: "把刚才那个灯再调暗一点"
  expected:
    intent: control_device
    room: living_room
    device_id: living_room_main_light
    device_type: light
    action: decrease_brightness
    policy_decision: allow
    dry_run_ready: true

- id: hallway_light_schedule_brightness
  input: "晚上十点后把走廊灯调到30%"
  expected:
    intent: control_device
    room: hallway
    device_id: hallway_light
    device_type: light
    action: set_brightness
    brightness: 30
    time_after: "22:00"
    policy_decision: allow
    dry_run_ready: true

- id: remember_hallway_light_alias
