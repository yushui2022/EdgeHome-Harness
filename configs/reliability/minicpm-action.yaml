inference:
  engine: ollama
  model: openbmb/minicpm5:latest
  request_timeout_ms: 60000
  max_output_tokens: 1024
  context_tokens: 4096
runtime:
  decision_protocol: action
  max_decision_repairs: 1
  max_model_calls: 2
  max_tool_calls: 1
  max_context_bytes: 32768
  require_tool_observation: true
