# MQTT executor profile example.
#
# Status: dry-run payload adapter and guarded publish executor implemented.
# Real broker publish must stay disabled by default.
#
# MQTT defines publish/subscribe transport. Smart-home topic and payload formats
# are application-specific. Device topics are configured in the trusted device
# registry, not emitted by MiniCPM.

backend: mqtt
status: guarded_publish_available

# Optional fixed broker URL for local-only tests. Prefer broker_url_env for
# private deployments and do not commit private URLs.
broker_url:
broker_url_env: EDGEHOME_MQTT_BROKER_URL
username_env: EDGEHOME_MQTT_USERNAME
password_env: EDGEHOME_MQTT_PASSWORD

client_id: edgehome-harness
request_timeout_ms: 5000
qos: 0
retain: false

# Must remain false by default. Enable only for an explicit local broker test
# after dry-run, gate, confirmation, idempotency, and rate-limit checks pass.
execute_enabled: false
