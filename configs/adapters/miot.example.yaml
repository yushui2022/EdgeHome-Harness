# MIoT bridge executor profile example.
#
# Status: bridge request adapter implemented. This project does not claim
# universal Xiaomi device support. The private bridge owns real did/siid/piid
# mapping, token handling, local/cloud protocol details, and state readback.
#
# MIoT identifiers such as did, siid, piid, and aiid must come from trusted
# bridge configuration, not from MiniCPM output or public prompts.

backend: miio_local
status: bridge_request_adapter

base_url: http://127.0.0.1:8787
token_env: EDGEHOME_MIOT_BRIDGE_TOKEN
request_timeout_ms: 5000

# Must remain false by default. Enable only when a local MIoT bridge is running
# and dry-run/gate/confirmation checks have passed.
execute_enabled: false
