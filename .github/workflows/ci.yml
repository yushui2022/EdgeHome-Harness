name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust checks and release gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repository hygiene
        run: |
          python - <<'PY'
          import pathlib
          import re
          import subprocess
          import sys

          tracked = subprocess.check_output(
              ["git", "ls-files"], text=True, encoding="utf-8"
          ).splitlines()
          failures = []
          binary_suffixes = {".jpg", ".jpeg", ".png", ".gif", ".ico", ".pdf"}

          for raw_path in tracked:
              normalized = raw_path.replace("\\", "/")
              path = pathlib.Path(raw_path)

              if re.search(r"(^|/)artifacts/", normalized):
                  failures.append(f"tracked artifact file: {raw_path}")
              if re.search(r"(^|/)\.env($|\.)", normalized):
                  failures.append(f"tracked environment file: {raw_path}")
              if re.search(r"\.(db|sqlite|sqlite3|log)$", normalized):
                  failures.append(f"tracked runtime output file: {raw_path}")

              if path.suffix.lower() in binary_suffixes:
                  continue
              try:
                  if path.stat().st_size > 2 * 1024 * 1024:
                      continue
                  content = path.read_text(encoding="utf-8")
              except (OSError, UnicodeDecodeError):
                  continue

              if re.search(r"-----BEGIN (RSA |EC |OPENSSH |)PRIVATE KEY-----", content):
                  failures.append(f"private key marker found in tracked file: {raw_path}")

              if (
                  normalized.startswith("configs/")
                  and ".example." in normalized
                  and re.search(r"(?m)^\s*execute_enabled:\s*true\s*$", content)
              ):
                  failures.append(
                      f"public example config enables real execution: {raw_path}"
                  )

          if failures:
              print("Repository hygiene failed:", file=sys.stderr)
              for failure in failures:
                  print(f"FAIL: {failure}", file=sys.stderr)
              sys.exit(1)

          print("repository hygiene passed")
          PY

      - name: Install Rust components
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup component add rustfmt clippy
          rustc --version
          cargo --version

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

      - name: Bounded agent reference examples
        run: |
          cargo run --locked -q -p edgehome-agent --example bounded_agent
          cargo run --locked -q -p edgehome-agent --example bounded_agent -- --execute-mock

      - name: Domain-independent SDK examples
        run: |
          cargo run --locked -q -p edgehome-inference --example document_agent
          cargo run --locked -q -p edgehome-inference --example document_agent -- --execute-demo

      - name: Independent SDK application and RPC smoke
        # Installs the CLI and tests path + Git modes against a temporary remote.
        # Relocation/upgrade/rollback share the target and dependency caches.
        run: python scripts/check-sdk-onboarding.py

      - name: Audit recorded model evidence and scorer tamper detection
        # Historical evidence integrity is separate from model qualification.
        # No inference server or model download is required for this audit.
        run: python scripts/verify-sdk-evidence.py docs/validation/reliability-2026-10-15 --skip-source-check --self-test

      - name: Audit file application evidence and scorer tamper detection
        # Historical integrity is separate from model qualification.
        run: |
          python scripts/verify-file-evidence.py docs/validation/file-agent-2026-10-16-v1 --skip-source-check
          python scripts/verify-file-evidence.py docs/validation/file-agent-2026-10-16-v2 --skip-source-check --self-test

      - name: JSON schema syntax validation
        run: |
          python - <<'PY'
          import json
          import pathlib

          for path in pathlib.Path("docs/schemas").glob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
              print(f"validated {path}")
          PY

      - name: Release eval gate
        run: cargo run --locked -q -p edgehome-cli -- --db-path edgehome-ci-gate.sqlite eval cases/zh-home.yaml --gate --summary

      - name: Backend readiness checks
        run: |
          cargo run --locked -q -p edgehome-cli -- backend check --backend home_assistant --registry configs/devices.home_assistant.example.yaml
          cargo run --locked -q -p edgehome-cli -- backend check --backend mqtt --registry configs/devices.mqtt.example.yaml
          cargo run --locked -q -p edgehome-cli -- backend check --backend miot --registry configs/devices.miot.example.yaml
          cargo run --locked -q -p edgehome-cli -- backend check --backend matter --registry configs/devices.matter.example.yaml

      - name: Diff whitespace check
        run: git diff --check

  windows-install:
    name: Windows SDK installation and portability
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Install, relocate, upgrade and roll back a generated app
        run: python scripts/check-sdk-onboarding.py
