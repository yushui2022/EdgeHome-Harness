[workspace]
members = [
    "crates/edgehome-core",
    "crates/edgehome-config",
    "crates/edgehome-storage",
    "crates/edgehome-trace",
    "crates/edgehome-parser",
    "crates/edgehome-registry",
    "crates/edgehome-gate",
    "crates/edgehome-memory",
    "crates/edgehome-ollama",
    "crates/edgehome-executor",
    "crates/edgehome-eval",
    "crates/edgehome-cli",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yushui2022/EdgeHome-Harness"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
schemars = { version = "0.8", features = ["derive"] }
thiserror = "2.0"
anyhow = "1.0"
clap = { version = "4.5", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
uuid = { version = "1.11", features = ["serde", "v4"] }
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1.41", features = ["macros", "rt-multi-thread", "time"] }
